name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aikayun
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: aikayun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aikayun -d aikayun_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://aikayun:ci-test-password@127.0.0.1:5432/aikayun_test
      POSTGRES_USER: aikayun
      POSTGRES_PASSWORD: ci-only-compose-password
      POSTGRES_DB: aikayun_test
      PUBLIC_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
      PG_PORT: "55432"
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      SITE_ADDRESS: :80
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Block high and critical dependency advisories
        run: pnpm audit --audit-level high
      - name: Prepare frozen license center for isolated signed tests
        env:
          LICENSE_CENTER_READ_TOKEN: ${{ secrets.LICENSE_CENTER_READ_TOKEN }}
        run: |
          test -n "$LICENSE_CENTER_READ_TOKEN"
          center_dir="$RUNNER_TEMP/aikayun-license-center-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export GIT_ASKPASS="$GITHUB_WORKSPACE/scripts/github-readonly-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          git clone --quiet --no-checkout https://github.com/YYKX682436/AiKayun-License.git "$center_dir"
          git -C "$center_dir" checkout --quiet --detach 185dac80204f60abbaa63ffeb5af7d7054b685d7
          test "$(git -C "$center_dir" rev-parse HEAD)" = 185dac80204f60abbaa63ffeb5af7d7054b685d7
          (cd "$center_dir" && npm ci)
          printf 'LICENSE_CENTER_CHECKOUT=%s\n' "$center_dir" >> "$GITHUB_ENV"
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit and PostgreSQL integration tests
        # Includes the three frozen-center interop/persistence files with the
        # pinned checkout above; the standalone script would repeat them.
        run: pnpm test
      - name: Install Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: pnpm --filter @aikayun/web exec playwright install chromium
      - name: Production build
        run: pnpm build
      - name: Verify release scan gate, sanitized reports and OCI bundle extraction
        run: |
          scripts/release/test-scan-gate.sh
          scripts/release/test-bundle-extraction.sh
      - name: Browser E2E against real PostgreSQL
        run: PLAYWRIGHT_USE_PRODUCTION_SERVER=true pnpm e2e
      - name: Verify production runtime branding
        run: pnpm --filter @aikayun/web test:e2e:production-brand
      - name: Configure ephemeral Compose payment encryption key
        run: |
          key="$(openssl rand -base64 32)"
          printf 'PAYMENT_CREDENTIAL_KEY_RING={"activeKeyId":"ci","keys":{"ci":"%s"}}\n' "$key" >> "$GITHUB_ENV"
      - name: Build and start full Compose stack
        run: docker compose up -d --build
      - name: Check Compose web, API and admin flow
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/v1/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/api/v1/health/ready
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3099/__fixture/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:3099/__fixture/health
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/ | grep -q '暂无可展示的商品'; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/ | grep -q '暂无可展示的商品'
          docker compose exec -T -e ADMIN_INITIAL_EMAIL=browser-test@example.com -e 'ADMIN_INITIAL_PASSWORD=Only-For-E2E-Tests-2026!!' api /nodejs/bin/node dist/admin-init.js
      - name: Run full Compose browser suite with signed test license
        env:
          COMPOSE_FILE: compose.yaml:compose.e2e.yaml:compose.e2e.signed.yaml
        run: |
          trap 'diagnostic_exit_code=$?; if [ "$diagnostic_exit_code" -ne 0 ]; then docker compose ps -a || true; docker compose logs --tail=180 api payment-fixture || true; fi; exit "$diagnostic_exit_code"' EXIT
          docker compose up -d --build --force-recreate api payment-fixture
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/health/ready >/dev/null && curl --fail --silent http://localhost:3099/__fixture/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/api/v1/health/ready
          curl --fail --silent http://localhost:3099/__fixture/health
          TEST_DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$PG_PORT/$POSTGRES_DB" PLAYWRIGHT_BASE_URL=http://localhost:8080 PLAYWRIGHT_EXTERNAL_SERVER=true pnpm --filter @aikayun/web exec playwright test
      - name: Restore production API before persistence check
        run: docker compose up -d --build --force-recreate api payment-fixture
      - name: Verify PostgreSQL data survives Compose rebuild
        run: |
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "CREATE TABLE compose_persistence_check (marker text PRIMARY KEY); INSERT INTO compose_persistence_check VALUES ('persisted');"
          docker compose up -d --build --force-recreate
          for attempt in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null; then break; fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/v1/health/ready >/dev/null; then break; fi
            sleep 2
          done
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT marker FROM compose_persistence_check' | grep -qx persisted
          curl --fail --silent http://localhost:8080/api/v1/health/ready
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/ | grep -q '全部商品'; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/ | grep -q '全部商品'
      - name: Digital delivery SIGKILL, backup restore and untrusted TLS acceptance
        run: node scripts/verify-digital-recovery.mjs
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Remove frozen test checkout
        if: always()
        run: rm -rf "$RUNNER_TEMP/aikayun-license-center-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  installer:
    name: Installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run controlled Linux installer command-flow regression
        env:
          AIKAYUN_TEST_ONLY_PLATFORM: linux/${{ matrix.arch }}
        run: scripts/install/test-ai-kayun-installer.sh

  verify:
    needs: [application, installer]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all CI jobs to pass
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
        run: |
          printf 'Application: %s\nInstaller matrix: %s\n' "$APPLICATION_RESULT" "$INSTALLER_RESULT"
          test "$APPLICATION_RESULT" = success
          test "$INSTALLER_RESULT" = success
