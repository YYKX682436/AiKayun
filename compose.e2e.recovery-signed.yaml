# Auxiliary signed API only for scripts/verify-digital-recovery.mjs; the normal
# production API remains responsible for SIGKILL and backup/restore acceptance.
services:
  signed-api:
    extends:
      file: compose.yaml
      service: api
    profiles: [signed-recovery]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.e2e-signed
    command: ["sh", "apps/api/test/fixtures/prepare-signed-center.sh", "test/fixtures/signed-existing-recovery-server.ts"]
    environment:
      NODE_ENV: test
      API_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LICENSE_CENTER_CHECKOUT: /license-center
      AIKAYUN_TEST_NODE_IMPORT: /test/register-procurement-selection-loader.mjs
    volumes:
      - ${LICENSE_CENTER_CHECKOUT:?Set LICENSE_CENTER_CHECKOUT to the frozen test checkout}:/license-center:ro
      - ./scripts/fixtures/register-procurement-selection-loader.mjs:/test/register-procurement-selection-loader.mjs:ro
      - ./scripts/fixtures/procurement-selection-loader.mjs:/test/procurement-selection-loader.mjs:ro
    ports:
      - "127.0.0.1:${SIGNED_RECOVERY_API_PORT:?Set an isolated API port}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    restart: "no"
