name: aikayun

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *bounded-logging
    image: ghcr.io/yykx682436/aikayun-postgres@sha256:b36f0783117de373b3ce8db84fc2187cee285c2af80fbca5f230f1b9eda3c192
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIKAYUN_DB_NAME:-aikayun}
      POSTGRES_USER: aikayun_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aikayun_bootstrap -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [private]

  db-role-init:
    logging: *bounded-logging
    image: ghcr.io/yykx682436/aikayun-postgres@sha256:b36f0783117de373b3ce8db84fc2187cee285c2af80fbca5f230f1b9eda3c192
    entrypoint: ["sh", "/deploy/bootstrap-production-db-roles.sh"]
    environment:
      POSTGRES_DB: ${AIKAYUN_DB_NAME:-aikayun}
      POSTGRES_USER: aikayun_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      AIKAYUN_API_DB_PASSWORD_FILE: /run/secrets/api_database_password
      AIKAYUN_MIGRATOR_DB_PASSWORD_FILE: /run/secrets/migrator_database_password
    secrets:
      - postgres_admin_password
      - api_database_password
      - migrator_database_password
    volumes:
      - ./deploy/bootstrap-production-db-roles.sh:/deploy/bootstrap-production-db-roles.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [private]

  state-volume-init:
    logging: *bounded-logging
    image: ghcr.io/yykx682436/aikayun-postgres@sha256:b36f0783117de373b3ce8db84fc2187cee285c2af80fbca5f230f1b9eda3c192
    user: "0:0"
    entrypoint: ["sh", "/deploy/prepare-state-volume.sh"]
    volumes:
      - aikayun_state:/var/lib/aikayun
      - ./deploy/prepare-state-volume.sh:/deploy/prepare-state-volume.sh:ro
    restart: "no"
    networks: [private]

  migrate:
    logging: *bounded-logging
    image: ghcr.io/yykx682436/aikayun-api@sha256:5bf045cefb45faef59cec0567d7efdd0cc383a656c05e5124af6b23180e851a3
    user: "1000:1000"
    command: ["dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      PUBLIC_ORIGIN: https://${AIKAYUN_PUBLIC_HOST:?Set the HTTPS storefront host}
      COOKIE_SECURE: "true"
      TRUST_PROXY_CIDRS: ${AIKAYUN_PRIVATE_SUBNET:-172.30.0.0/24}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${AIKAYUN_DB_NAME:-aikayun}
      PGUSER: aikayun_migrator
      PGPASSWORD_FILE: /run/secrets/migrator_database_password
      MEDIA_ROOT: /var/lib/aikayun/media
      PRIVATE_FILE_ROOT: /var/lib/aikayun/private-files
      INSTANCE_IDENTITY_ROOT: /var/lib/aikayun/identity
      LICENSE_TRUST_STORE_ROOT: /var/lib/aikayun/license-trust
      LICENSE_PENDING_KEY_ROOT: /var/lib/aikayun/license-pending
    secrets:
      - migrator_database_password
    volumes:
      - aikayun_state:/var/lib/aikayun
    depends_on:
      db-role-init:
        condition: service_completed_successfully
      state-volume-init:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private]

  production-install-init:
    logging: *bounded-logging
    image: ghcr.io/yykx682436/aikayun-api@sha256:5bf045cefb45faef59cec0567d7efdd0cc383a656c05e5124af6b23180e851a3
    user: "1000:1000"
    command: ["dist/production-install-init.js"]
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${AIKAYUN_PUBLIC_HOST:?Set the HTTPS storefront host}
      COOKIE_SECURE: "true"
      TRUST_PROXY_CIDRS: ${AIKAYUN_PRIVATE_SUBNET:-172.30.0.0/24}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${AIKAYUN_DB_NAME:-aikayun}
      PGUSER: aikayun_app
      PGPASSWORD_FILE: /run/secrets/api_database_password
      MEDIA_ROOT: /var/lib/aikayun/media
      PRIVATE_FILE_ROOT: /var/lib/aikayun/private-files
      INSTANCE_IDENTITY_ROOT: /var/lib/aikayun/identity
      LICENSE_TRUST_STORE_ROOT: /var/lib/aikayun/license-trust
      LICENSE_PENDING_KEY_ROOT: /var/lib/aikayun/license-pending
    secrets:
      - api_database_password
    volumes:
      - aikayun_state:/var/lib/aikayun
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private]

  api:
    logging: *bounded-logging
    image: ghcr.io/yykx682436/aikayun-api@sha256:5bf045cefb45faef59cec0567d7efdd0cc383a656c05e5124af6b23180e851a3
    user: "1000:1000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      AIKAYUN_UPGRADE_PROBE_ONLY: ${AIKAYUN_UPGRADE_PROBE_ONLY:-false}
      PUBLIC_ORIGIN: https://${AIKAYUN_PUBLIC_HOST:?Set the HTTPS storefront host}
      COOKIE_SECURE: "true"
      TRUST_PROXY_CIDRS: ${AIKAYUN_PRIVATE_SUBNET:-172.30.0.0/24}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${AIKAYUN_DB_NAME:-aikayun}
      PGUSER: aikayun_app
      PGPASSWORD_FILE: /run/secrets/api_database_password
      MEDIA_ROOT: /var/lib/aikayun/media
      PRIVATE_FILE_ROOT: /var/lib/aikayun/private-files
      INSTANCE_IDENTITY_ROOT: /var/lib/aikayun/identity
      LICENSE_TRUST_STORE_ROOT: /var/lib/aikayun/license-trust
      LICENSE_PENDING_KEY_ROOT: /var/lib/aikayun/license-pending
      LICENSE_TRUST_BUNDLE_FILE: /run/secrets/license-trust-bundle.jws
      PAYMENT_CREDENTIAL_KEY_RING_FILE: /run/secrets/payment_credential_key_ring
      CODE_POOL_ENCRYPTION_KEY_RING_FILE: /run/secrets/code_pool_encryption_key_ring
    secrets:
      - api_database_password
      - payment_credential_key_ring
      - code_pool_encryption_key_ring
    volumes:
      - aikayun_state:/var/lib/aikayun
      - ${AIKAYUN_LICENSE_TRUST_BUNDLE_FILE:?Set the verified release Trust Bundle artifact}:/run/secrets/license-trust-bundle.jws:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      production-install-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private]

  web:
    logging: *bounded-logging
    image: ghcr.io/yykx682436/aikayun-web@sha256:1a212d26cca21ef9ae12c3d9c5dd1f3e25d633020e31a6106624b0c924e08fb7
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_API_INTERNAL_URL: http://api:3001
      NUXT_PUBLIC_SITE_URL: https://${AIKAYUN_PUBLIC_HOST:?Set the HTTPS storefront host}
      NUXT_PUBLIC_STORE_NAME: ${NUXT_PUBLIC_STORE_NAME:-AiKayun 数字商城}
      NUXT_PUBLIC_STORE_LOGO_URL: ${NUXT_PUBLIC_STORE_LOGO_URL:-}
      NUXT_PUBLIC_STORE_BRAND_COLOR: ${NUXT_PUBLIC_STORE_BRAND_COLOR:-#2563EB}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private]

  caddy:
    logging: *bounded-logging
    image: docker.io/library/caddy@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${AIKAYUN_PUBLIC_HOST:?Set the HTTPS storefront host}
    ports:
      - "${AIKAYUN_HTTP_BIND_ADDRESS:-0.0.0.0}:${AIKAYUN_HTTP_PORT:-80}:80"
      - "${AIKAYUN_HTTPS_BIND_ADDRESS:-0.0.0.0}:${AIKAYUN_HTTPS_PORT:-443}:443"
      - "${AIKAYUN_HTTPS_BIND_ADDRESS:-0.0.0.0}:${AIKAYUN_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    networks: [private]

volumes:
  postgres_data:
    name: aikayun_postgres_data
  aikayun_state:
    name: aikayun_state
    external: true
  caddy_data:
    name: aikayun_caddy_data
  caddy_config:
    name: aikayun_caddy_config

secrets:
  postgres_admin_password:
    file: ${AIKAYUN_POSTGRES_ADMIN_PASSWORD_FILE:?Provide the PostgreSQL bootstrap secret file}
  api_database_password:
    file: ${AIKAYUN_API_DATABASE_PASSWORD_FILE:?Provide the API database secret file}
  migrator_database_password:
    file: ${AIKAYUN_MIGRATOR_DATABASE_PASSWORD_FILE:?Provide the migrator database secret file}
  payment_credential_key_ring:
    file: ${AIKAYUN_PAYMENT_CREDENTIAL_KEY_RING_FILE:?Provide the payment encryption key-ring file}
  code_pool_encryption_key_ring:
    file: ${AIKAYUN_CODE_POOL_ENCRYPTION_KEY_RING_FILE:?Provide the delivery encryption key-ring file}

networks:
  private:
    name: aikayun_private
    ipam:
      config:
        - subnet: ${AIKAYUN_PRIVATE_SUBNET:-172.30.0.0/24}
