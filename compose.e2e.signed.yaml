# CI-only, disposable stack: the API uses authentic frozen-center test signatures.
# Never include this file for production deployments.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.e2e-signed
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LICENSE_CENTER_CHECKOUT: /license-center
    volumes:
      - ${LICENSE_CENTER_CHECKOUT:?Set LICENSE_CENTER_CHECKOUT to the frozen test checkout}:/license-center:ro
